async function doImport(){

  for(const p of t.photos){if(!p.data)continue;try{const key=uid();await DB.put(key,{buf:d2b(p.data),w:p.w,h:p.h});ph.push({key,cap:p.cap||""})}catch(e){}}

const esc=s=>String(s==null?"":s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

function mkDocx(body,media){
